spring:
  application:
    name: dari-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dari}
    username: ${POSTGRES_USER:dari}
    password: ${POSTGRES_PASSWORD:dari_local}
    hikari:
      maximum-pool-size: 10
      pool-name: dari-pool

  jpa:
    open-in-view: false           # a lazy load inside a view render is a bug, not a convenience
    hibernate:
      ddl-auto: validate          # Flyway owns the schema. This must never become "update".
    properties:
      hibernate:
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations stay backward-compatible for one release so a rollback does not
    # strand the schema: expand, backfill, switch reads, contract later.

  jackson:
    # `always`, not `non_null`. Omitting nulls made the wire disagree with the
    # TypeScript the web client is written against: every response DTO field is
    # declared `T | null` there, but an absent key arrives as `undefined`, and
    # `undefined !== null` is true -- so nine `x !== null` guards in the client
    # rendered their branch for a field the server had simply not sent. The
    # listing detail page showed "chambre", "salle de bain" and
    # "Séjour minimum : mois" with the numbers missing.
    #
    # The two DTOs that genuinely want omission say so themselves with
    # @JsonInclude(NON_NULL) -- ErrorResponse's optional `details`, and
    # CursorPage's `nextCursor`, whose absence is what "no more pages" means --
    # and an annotation beats this setting, so both keep the shape their
    # consumers expect.
    default-property-inclusion: always

  servlet:
    multipart:
      # Deliberately ABOVE LocalImageStore's own 5 MB rule, not equal to it.
      # Spring's defaults are 1 MB per file and 10 MB per request, which silently
      # contradicted that rule: any ordinary phone photo was rejected by the
      # container before the domain check could run, and the failure surfaced as
      # a bare 500 rather than the French envelope. Leaving headroom here keeps
      # "La photo doit faire moins de 5 Mo" the message a user actually sees;
      # this limit is only the outer backstop for absurd payloads.
      max-file-size: 6MB
      max-request-size: 8MB

server:
  port: ${API_PORT:8080}
  error:
    include-stacktrace: never     # errors leave through the envelope or not at all
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

dari:
  web-origins: ${DARI_WEB_ORIGIN:http://localhost:3000}
  upload-dir: ${DARI_UPLOAD_DIR:./uploads}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:./infra/firebase/service-account.json}

  # Location privacy. Read by the fuzzer in phase 02; centralized here so the
  # value is auditable rather than buried as a literal in a service.
  location:
    fuzz-radius-metres: 200

  # Listing expiry (phase 10). Sixty days keeps the marketplace credible;
  # stale listings are the exact failure Dari exists to replace.
  listing:
    expiry-days: 60
    expiry-warning-days: 53

logging:
  level:
    ma.dari.api: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n"
