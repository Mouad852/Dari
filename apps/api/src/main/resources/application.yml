spring:
  application:
    name: dari-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dari}
    username: ${POSTGRES_USER:dari}
    password: ${POSTGRES_PASSWORD:dari_local}
    hikari:
      maximum-pool-size: 10
      pool-name: dari-pool
      # Fail a request quickly when no connection can be had, instead of
      # queueing behind a pool that a hung database has already exhausted. Also
      # bounds how long a readiness probe waits before reporting DOWN.
      connection-timeout: 5000     # ms
      validation-timeout: 3000     # ms, must stay below connection-timeout
      # Passed to the PostgreSQL driver for pool connections only (Flyway gets
      # its own connections below).
      data-source-properties:
        connectTimeout: 5          # s, TCP connect
        # s, a read that never returns. Kept above the statement timeout so the
        # server cancels a slow query cleanly before the socket gives up on it.
        socketTimeout: 45
        # A pathological radius search dies with an error instead of pinning one
        # of ten connections until the pool is gone.
        options: -c statement_timeout=${DARI_DB_STATEMENT_TIMEOUT:30s}

  jpa:
    open-in-view: false           # a lazy load inside a view render is a bug, not a convenience
    hibernate:
      ddl-auto: validate          # Flyway owns the schema. This must never become "update".
    properties:
      hibernate:
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations run WITHOUT the statement timeout above: a future CREATE INDEX
    # on a large table must not be killed at 30s halfway through a deploy.
    # Setting url/user/password makes Boot give Flyway its own unpooled
    # connections, which never see the pool's driver options. A SET on a pooled
    # connection would not do: Hikari does not reset session settings, so the
    # exemption would leak back into the application's pool. init-sqls then
    # also overrides any timeout configured on the role or database itself.
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    init-sqls: SET statement_timeout = 0
    # Migrations stay backward-compatible for one release so a rollback does not
    # strand the schema: expand, backfill, switch reads, contract later.

  jackson:
    # `always`, not `non_null`. Omitting nulls made the wire disagree with the
    # TypeScript the web client is written against: every response DTO field is
    # declared `T | null` there, but an absent key arrives as `undefined`, and
    # `undefined !== null` is true -- so nine `x !== null` guards in the client
    # rendered their branch for a field the server had simply not sent. The
    # listing detail page showed "chambre", "salle de bain" and
    # "Séjour minimum : mois" with the numbers missing.
    #
    # The two DTOs that genuinely want omission say so themselves with
    # @JsonInclude(NON_NULL) -- ErrorResponse's optional `details`, and
    # CursorPage's `nextCursor`, whose absence is what "no more pages" means --
    # and an annotation beats this setting, so both keep the shape their
    # consumers expect.
    default-property-inclusion: always

  servlet:
    multipart:
      # Deliberately ABOVE LocalImageStore's own 5 MB rule, not equal to it.
      # Spring's defaults are 1 MB per file and 10 MB per request, which silently
      # contradicted that rule: any ordinary phone photo was rejected by the
      # container before the domain check could run, and the failure surfaced as
      # a bare 500 rather than the French envelope. Leaving headroom here keeps
      # "La photo doit faire moins de 5 Mo" the message a user actually sees;
      # this limit is only the outer backstop for absurd payloads.
      max-file-size: 6MB
      max-request-size: 8MB

  # On SIGTERM: stop accepting requests, let in-flight ones finish, and let a
  # running expiry, outbox or media-cleanup batch complete rather than cutting
  # it off mid-transaction. Each phase gets 30s; the platform's kill grace
  # period must be longer than the two combined (see PRODUCTION_OPERATIONS.md).
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s

server:
  port: ${API_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never     # errors leave through the envelope or not at all
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness and /readiness. Liveness is the process only:
      # a database outage must take the instance out of rotation, never get it
      # restarted, because a restart cannot fix the database and every replica
      # would restart at once. Readiness adds the database so the platform stops
      # routing traffic an instance cannot serve, and resumes when it recovers.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

dari:
  web-origins: ${DARI_WEB_ORIGIN:http://localhost:3000}
  upload-dir: ${DARI_UPLOAD_DIR:./uploads}
  media:
    provider: ${DARI_MEDIA_PROVIDER:local}
    public-base-url: ${DARI_MEDIA_PUBLIC_BASE_URL:/uploads}
    cleanup-interval-ms: ${DARI_MEDIA_CLEANUP_INTERVAL_MS:60000}
    s3:
      endpoint: ${DARI_MEDIA_S3_ENDPOINT:}
      region: ${DARI_MEDIA_S3_REGION:eu-west-1}
      access-key: ${DARI_MEDIA_S3_ACCESS_KEY:}
      secret-key: ${DARI_MEDIA_S3_SECRET_KEY:}
      bucket: ${DARI_MEDIA_S3_BUCKET:}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:./infra/firebase/service-account.json}

  # Location privacy. Read by the fuzzer in phase 02; centralized here so the
  # value is auditable rather than buried as a literal in a service.
  location:
    fuzz-radius-metres: 200
    # Development/test only. Production overrides this with a required secret.
    fuzz-secret: ${DARI_LOCATION_FUZZ_SECRET:development-only-location-fuzz-secret-change-before-production}

  # Listing expiry (phase 10). Sixty days keeps the marketplace credible;
  # stale listings are the exact failure Dari exists to replace.
  listing:
    expiry-days: 60
    expiry-warning-days: 7

  notifications:
    # Delivery is opt-in. Configure spring.mail.* and the sender before enabling.
    enabled: ${DARI_NOTIFICATIONS_ENABLED:false}
    from: ${DARI_NOTIFICATIONS_FROM:no-reply@dari.ma}
    batch-size: ${DARI_NOTIFICATIONS_BATCH_SIZE:50}
    max-attempts: ${DARI_NOTIFICATIONS_MAX_ATTEMPTS:5}
    retry-delay-seconds: ${DARI_NOTIFICATIONS_RETRY_DELAY_SECONDS:60}
    stale-after-minutes: ${DARI_NOTIFICATIONS_STALE_AFTER_MINUTES:15}
    delivery-interval-ms: ${DARI_NOTIFICATIONS_DELIVERY_INTERVAL_MS:30000}

  # Process-local abuse protection. Each policy applies independently to the
  # authenticated Firebase identity and source address.
  rate-limits:
    # This bounds the per-client keys held by this single-process limiter.
    # At capacity, new clients share a fixed overflow bucket rather than
    # allocating more memory or bypassing enforcement.
    max-tracked-keys: ${DARI_RATE_LIMIT_MAX_TRACKED_KEYS:100000}
    report:
      max: ${DARI_RATE_LIMIT_REPORT_MAX:5}
      window: ${DARI_RATE_LIMIT_REPORT_WINDOW:PT1H}
    message:
      max: ${DARI_RATE_LIMIT_MESSAGE_MAX:30}
      window: ${DARI_RATE_LIMIT_MESSAGE_WINDOW:PT1M}
    listing:
      max: ${DARI_RATE_LIMIT_LISTING_MAX:5}
      window: ${DARI_RATE_LIMIT_LISTING_WINDOW:PT1H}
    upload:
      max: ${DARI_RATE_LIMIT_UPLOAD_MAX:20}
      window: ${DARI_RATE_LIMIT_UPLOAD_WINDOW:PT1H}
    signup:
      max: ${DARI_RATE_LIMIT_SIGNUP_MAX:5}
      window: ${DARI_RATE_LIMIT_SIGNUP_WINDOW:PT1H}
    search:
      max: ${DARI_RATE_LIMIT_SEARCH_MAX:120}
      window: ${DARI_RATE_LIMIT_SEARCH_WINDOW:PT1M}
    # Next.js Server Components share the web runtime's source IP. This is a
    # deliberate site-wide protective ceiling, not per-visitor fairness.
    ssr-read:
      max: ${DARI_RATE_LIMIT_SSR_READ_MAX:10000}
      window: ${DARI_RATE_LIMIT_SSR_READ_WINDOW:PT1M}

logging:
  level:
    ma.dari.api: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n"
