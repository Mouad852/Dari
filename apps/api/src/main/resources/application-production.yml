# Production requires explicit deployment values. TLS is terminated by the
# ingress/load balancer; forwarded headers keep Spring's security behavior
# aligned with the original HTTPS request.
server:
  # Let Tomcat's RemoteIpValve process headers only when the TCP peer matches
  # the target-facing ALB range. It walks X-Forwarded-For from the right, so
  # the ALB-appended last-hop address wins over any caller-supplied entries.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${DARI_TRUSTED_PROXY_IPS}
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      protocol-header-https-value: https

spring:
  # No defaults. application.yml falls back to localhost and the dari_local
  # development password; in production a missing variable must stop startup,
  # not quietly connect with a development credential.
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  # SMTP for notification delivery. These are the variable names the runbooks
  # and validation scripts use; without this block Spring would only read
  # SPRING_MAIL_*, and the documented names would silently do nothing.
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true      # never fall back to plaintext credentials
          # Milliseconds. JavaMail's defaults are infinite: a provider that
          # accepts the connection and then stalls would hold the delivery
          # thread, and with it every other scheduled job, indefinitely.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

dari:
  # No default: the image tag this task runs. Every error report and
  # /actuator/info carry it; "development" in production is the mislabel the
  # startup check exists to refuse.
  release-version: ${DARI_RELEASE_VERSION}
  error-reporting:
    # SENTRY_DSN stays optional (application.yml); a production start without
    # it logs one warning naming the variable.
    environment: ${SENTRY_ENVIRONMENT:production}
  metrics:
    cloudwatch:
      # On by default: alarms 3-5 read these metrics. Needs the task role's
      # cloudwatch:PutMetricData; without it the push fails on its own thread
      # and the "DB unreachable" alarm goes off on the missing data.
      enabled: ${DARI_METRICS_CLOUDWATCH_ENABLED:true}
  web-origins: ${DARI_WEB_ORIGIN}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH}
  location:
    # No default: a public listing id must not be enough to reconstruct its pin offset.
    fuzz-secret: ${DARI_LOCATION_FUZZ_SECRET}
  ssr:
    # No default. Shared with the web runtime (same name there, server-only);
    # a request presenting it is a trusted server render for rate limiting.
    shared-secret: ${DARI_SSR_SHARED_SECRET}
  # No defaults. application.yml falls back to local disk and empty S3
  # credentials, which boots fine and then fails every upload with a 503.
  media:
    provider: ${DARI_MEDIA_PROVIDER}
    public-base-url: ${DARI_MEDIA_PUBLIC_BASE_URL}
    s3:
      endpoint: ${DARI_MEDIA_S3_ENDPOINT}
      region: ${DARI_MEDIA_S3_REGION}
      access-key: ${DARI_MEDIA_S3_ACCESS_KEY}
      secret-key: ${DARI_MEDIA_S3_SECRET_KEY}
      bucket: ${DARI_MEDIA_S3_BUCKET}
  notifications:
    # Opt-out in production, opt-in in development. Moderation outcomes and
    # expiry warnings are the only channel Dari has to its users; a deploy that
    # forgot the flag used to queue them in the outbox forever without a word.
    enabled: ${DARI_NOTIFICATIONS_ENABLED:true}
    # No default: the sender must be an address the SMTP provider has verified
    # for this domain, which a built-in fallback cannot know.
    from: ${DARI_NOTIFICATIONS_FROM}
