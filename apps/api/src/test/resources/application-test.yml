# Testcontainers supplies the datasource; nothing is hardcoded here on purpose.
# The container image is postgis/postgis, not postgres — phase 02's generated
# column and GiST index must be exercised by the same engine production runs.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

dari:
  release-version: test-release-4b1d
  web-origins: http://localhost:3000
  firebase:
    credentials-path: unused-in-tests   # FirebaseConfig is excluded from this profile
  ssr:
    shared-secret: test-only-ssr-shared-secret-with-at-least-32-characters
  # Scheduled jobs never fire on their own during the suite. Every cached test
  # context runs its own scheduler over the one shared database and ShedLock
  # table, so a background run could take the lock, or a row, that a test is
  # asserting on. Tests call the jobs directly.
  media:
    cleanup-interval-ms: 3600000
  listing:
    expiry-cron: "-"
  # Integration tests exercise endpoint behavior, not production quotas. The
  # limiter itself is covered with deliberately small windows in unit tests.
  rate-limits:
    max-tracked-keys: 100000
    report: { max: 10000, window: PT1H }
    message: { max: 10000, window: PT1H }
    listing: { max: 10000, window: PT1H }
    upload: { max: 10000, window: PT1H }
    signup: { max: 10000, window: PT1H }
    search: { max: 10000, window: PT1M }
    ssr-read: { max: 10000, window: PT1M }

logging:
  level:
    ma.dari.api: DEBUG
