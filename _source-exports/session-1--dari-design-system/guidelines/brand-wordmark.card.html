<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div style="display:flex;gap:20px;align-items:center">
<div style="flex:0 0 200px;height:110px;border-radius:var(--radius-card);background:var(--clay-500);display:flex;align-items:center;justify-content:center">
<span style="font:var(--weight-extra) 34px/1 var(--font-display);letter-spacing:-.02em;color:#fff">dari</span></div>
<div style="flex:0 0 200px;height:110px;border-radius:var(--radius-card);background:var(--surface-card);border:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center">
<span style="font:var(--weight-extra) 34px/1 var(--font-display);letter-spacing:-.02em;color:var(--clay-600)">dari</span></div>
<div style="flex:1;display:grid;gap:8px"><div class="hex">Toujours en minuscules, poids 800, tracking -.02em.</div>
<div class="hex">Sur terracotta : blanc. Sur crème : clay-600.</div>
<div class="hex">Aucun symbole dessiné : à remplacer par le vrai logo.</div></div></div></body></html>
