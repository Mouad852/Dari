<!-- @dsCard group="Brand" viewport="700x160" name="Elevation" subtitle="Warm brown-tinted shadows; grey shadows are off-brand" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div style="display:flex;gap:14px"><div style="flex:1;text-align:center"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-xs)"></div><div class="lbl">shadow-xs</div></div><div style="flex:1;text-align:center"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></div><div class="lbl">shadow-sm</div></div><div style="flex:1;text-align:center"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-md)"></div><div class="lbl">shadow-md</div></div><div style="flex:1;text-align:center"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-lg)"></div><div class="lbl">shadow-lg</div></div><div style="flex:1;text-align:center"><div style="height:70px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-brand)"></div><div class="lbl">shadow-brand</div></div></div>
<div class="hex" style="margin-top:10px">Repos : xs/sm. Survol : md + translateY(-2px). Feuilles : shadow-sheet. Boutons primaires : shadow-brand.</div></body></html>
