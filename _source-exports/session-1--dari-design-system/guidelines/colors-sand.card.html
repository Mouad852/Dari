<!-- @dsCard group="Colors" viewport="700x140" name="Sand — warm secondary" subtitle="Highlights, ratings, illustration fills; never a button fill" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div class="sw"><div><div class="chip" style="background:var(--sand-50)"></div><div class="lbl">sand-50</div><div class="hex">#FDF6EA</div></div><div><div class="chip" style="background:var(--sand-100)"></div><div class="lbl">sand-100</div><div class="hex">#F9E9CC</div></div><div><div class="chip" style="background:var(--sand-200)"></div><div class="lbl">sand-200</div><div class="hex">#F2D49F</div></div><div><div class="chip" style="background:var(--sand-300)"></div><div class="lbl">sand-300</div><div class="hex">#E8B96B</div></div><div><div class="chip" style="background:var(--sand-400)"></div><div class="lbl">sand-400</div><div class="hex">#DDA046</div></div><div><div class="chip" style="background:var(--sand-500)"></div><div class="lbl">sand-500</div><div class="hex">#C9862C</div></div><div><div class="chip" style="background:var(--sand-700)"></div><div class="lbl">sand-700</div><div class="hex">#7F521A</div></div></div></body></html>
