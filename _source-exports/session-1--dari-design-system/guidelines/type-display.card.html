<!-- @dsCard group="Type" viewport="700x180" name="Display & headings" subtitle="Plus Jakarta Sans 800/700, tight tracking" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div style="display:grid;gap:10px">
<div style="font:var(--weight-extra) var(--text-display-lg)/var(--lh-tight) var(--font-display);letter-spacing:var(--ls-display);color:var(--text-heading)">Trouvez votre chambre</div>
<div style="font:var(--type-display);letter-spacing:var(--ls-display);color:var(--text-heading)">Display 32 / 800</div>
<div style="display:flex;gap:24px;align-items:baseline"><span style="font:var(--type-h1);color:var(--text-heading)">H1 28 / 700</span>
<span style="font:var(--type-h2);color:var(--text-heading)">H2 22 / 700</span>
<span style="font:var(--type-h3);color:var(--text-heading)">H3 18 / 600</span></div></div></body></html>
