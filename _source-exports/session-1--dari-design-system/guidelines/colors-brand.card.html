<!-- @dsCard group="Colors" viewport="700x140" name="Terracotta — brand accent" subtitle="--brand ladder; 500 is the only fill for primary actions" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div class="sw"><div><div class="chip" style="background:var(--clay-50)"></div><div class="lbl">clay-50</div><div class="hex">#FDF1EC</div></div><div><div class="chip" style="background:var(--clay-100)"></div><div class="lbl">clay-100</div><div class="hex">#F8DFD4</div></div><div><div class="chip" style="background:var(--clay-200)"></div><div class="lbl">clay-200</div><div class="hex">#F0C2AE</div></div><div><div class="chip" style="background:var(--clay-300)"></div><div class="lbl">clay-300</div><div class="hex">#E39F82</div></div><div><div class="chip" style="background:var(--clay-500)"></div><div class="lbl">clay-500 · brand</div><div class="hex">#C05F3C</div></div><div><div class="chip" style="background:var(--clay-600)"></div><div class="lbl">clay-600 · hover</div><div class="hex">#A94E2E</div></div><div><div class="chip" style="background:var(--clay-700)"></div><div class="lbl">clay-700 · press</div><div class="hex">#8B3E24</div></div><div><div class="chip" style="background:var(--clay-900)"></div><div class="lbl">clay-900</div><div class="hex">#4A2214</div></div></div></body></html>
