<!-- @dsCard group="Type" viewport="700x180" name="Body & labels" subtitle="15px default, 1.55 line-height, muted secondary line" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div style="display:grid;gap:10px;max-width:var(--container-prose)">
<p style="font:var(--type-body-lg);color:var(--text-body)">Body LG 17 — introduction d'annonce, une ou deux phrases maximum.</p>
<p style="font:var(--type-body);color:var(--text-body)">Body MD 15 — texte courant de l'interface : descriptions, messages, règles de la colocation. Interlignage 1,55.</p>
<p style="font:var(--weight-regular) var(--text-body-sm)/var(--lh-snug) var(--font-ui);color:var(--text-muted)">Body SM 13 — métadonnées, quartier, disponibilité.</p>
<div style="display:flex;gap:20px;align-items:baseline"><span style="font:var(--type-label);color:var(--text-heading)">Label 13 / 600</span>
<span style="font:var(--type-caption);color:var(--text-muted)">Caption 12 / 500</span>
<span style="font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--clay-600)">Eyebrow 11</span></div></div></body></html>
