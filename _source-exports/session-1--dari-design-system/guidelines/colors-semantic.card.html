<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Atlas green, saffron, rose clay, majorelle — all warm-shifted" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div class="sw"><div><div class="chip" style="background:var(--success)"></div><div class="lbl">success</div><div class="hex">#35786A</div></div><div><div class="chip" style="background:var(--success-subtle)"></div><div class="lbl">success-subtle</div><div class="hex">#EAF3EF</div></div><div><div class="chip" style="background:var(--warning)"></div><div class="lbl">warning</div><div class="hex">#C98A16</div></div><div><div class="chip" style="background:var(--warning-subtle)"></div><div class="lbl">warning-subtle</div><div class="hex">#FEF5E0</div></div><div><div class="chip" style="background:var(--danger)"></div><div class="lbl">danger</div><div class="hex">#B33A2B</div></div><div><div class="chip" style="background:var(--danger-subtle)"></div><div class="lbl">danger-subtle</div><div class="hex">#FCEDEA</div></div><div><div class="chip" style="background:var(--info)"></div><div class="lbl">info</div><div class="hex">#3F5AA6</div></div><div><div class="chip" style="background:var(--info-subtle)"></div><div class="lbl">info-subtle</div><div class="hex">#EDF0FA</div></div></div></body></html>
