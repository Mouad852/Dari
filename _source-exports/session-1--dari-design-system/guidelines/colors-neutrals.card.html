<!-- @dsCard group="Colors" viewport="700x140" name="Sable — warm neutrals" subtitle="Cream surfaces to charcoal text; no pure white, no pure black" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div class="sw"><div><div class="chip" style="background:var(--sable-0)"></div><div class="lbl">sable-0</div><div class="hex">#FFFFFF</div></div><div><div class="chip" style="background:var(--sable-50)"></div><div class="lbl">sable-50 · page</div><div class="hex">#FBF7F2</div></div><div><div class="chip" style="background:var(--sable-100)"></div><div class="lbl">sable-100</div><div class="hex">#F5EFE7</div></div><div><div class="chip" style="background:var(--sable-200)"></div><div class="lbl">sable-200 · hairline</div><div class="hex">#E9E1D6</div></div><div><div class="chip" style="background:var(--sable-300)"></div><div class="lbl">sable-300</div><div class="hex">#D8CDBF</div></div><div><div class="chip" style="background:var(--sable-600)"></div><div class="lbl">sable-600 · muted</div><div class="hex">#6E635C</div></div><div><div class="chip" style="background:var(--sable-800)"></div><div class="lbl">sable-800 · body</div><div class="hex">#332D29</div></div><div><div class="chip" style="background:var(--sable-900)"></div><div class="lbl">sable-900 · heading</div><div class="hex">#241F1C</div></div></div></body></html>
