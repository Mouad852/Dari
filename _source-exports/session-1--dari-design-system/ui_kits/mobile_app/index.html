<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Dari — application mobile</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg-page-alt);display:flex;justify-content:center}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="FeedScreen.jsx"></script>
<script type="text/babel" src="ListingScreen.jsx"></script>
<script type="text/babel" src="MessagesScreen.jsx"></script>
<script type="text/babel" src="ProfileScreen.jsx"></script>
<script type="text/babel" src="FiltersSheet.jsx"></script>
<script type="text/babel">
const { Toast } = window.DariDesignSystem_d1bbe2||{};
function App(){
  const [tab,setTab]=React.useState('feed');
  const [listing,setListing]=React.useState(null);
  const [thread,setThread]=React.useState(null);
  const [filters,setFilters]=React.useState(false);
  const [saved,setSaved]=React.useState({1:true});
  const [toast,setToast]=React.useState(null);
  const [msgs,setMsgs]=React.useState([{text:'Bonjour Nadia, la chambre est-elle toujours disponible ?',me:true},{text:'Bonjour Salma, oui, libre à partir du 1er septembre.',me:false}]);
  const flash=(t)=>{setToast(t);setTimeout(()=>setToast(null),2600)};
  const toggleSave=(id)=>{setSaved(s=>({...s,[id]:!s[id]}));flash(saved[id]?'Retiré des favoris':'Annonce enregistrée')};
  const title={feed:'Explorer',saved:'Favoris',messages:'Messages',profile:'Profil'}[tab];
  let body,top=true;
  if(listing){top=false;body=<ListingScreen listing={listing} saved={!!saved[listing.id]} onBack={()=>setListing(null)}
    onSave={()=>toggleSave(listing.id)} onContact={()=>{setListing(null);setTab('messages');setThread(window.THREADS[0])}}/>;}
  else if(thread) body=<ThreadScreen thread={thread} messages={msgs} onSend={t=>{setMsgs(m=>[...m,{text:t,me:true}]);flash('Message envoyé à '+thread.name)}}/>;
  else if(tab==='feed') body=<FeedScreen saved={saved} onSave={toggleSave} onOpen={setListing} onOpenFilters={()=>setFilters(true)}/>;
  else if(tab==='saved') body=<SavedScreen saved={saved} onOpen={setListing}/>;
  else if(tab==='messages') body=<MessagesScreen onOpenThread={setThread}/>;
  else body=<ProfileScreen/>;
  return <Phone>
    <StatusBar/>
    {top&&(thread
      ? <TopBar title={thread.name} onBack={()=>setThread(null)}/>
      : tab!=='feed'&&<TopBar title={title}/>)}
    {body}
    {!listing&&!thread&&<TabBar active={tab} onChange={setTab} unread={2}/>}
    <FiltersSheet open={filters} onClose={()=>setFilters(false)} onApply={()=>{setFilters(false);flash('Filtres appliqués')}}/>
    {toast&&<div style={{position:'absolute',left:16,right:16,bottom:88,display:'flex',justifyContent:'center'}}><Toast tone="success">{toast}</Toast></div>}
  </Phone>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
