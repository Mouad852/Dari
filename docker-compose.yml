# Local development dependencies only. The API and the web app run on the host
# so that hot reload works; only stateful services live in containers.
services:
  db:
    image: postgis/postgis:16-3.4          # pinned: phase 02's generated column
    container_name: dari-db                # must behave identically in dev/CI/prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dari}
      POSTGRES_USER: ${POSTGRES_USER:-dari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dari_local}
    ports: ["5432:5432"]
    volumes:
      - dari_pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dari} -d ${POSTGRES_DB:-dari}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for listing photos (phase 05). S3-compatible, so the
  # production switch to a real bucket is a config change, not a code change.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: dari-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dari
      MINIO_ROOT_PASSWORD: dari_local_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["dari_minio:/data"]

volumes:
  dari_pgdata:
  dari_minio:
