<!-- @dsCard group="Type" viewport="700x150" name="Prices & numerals" subtitle="Bold UI numerals for prices; IBM Plex Mono for IDs and codes" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div style="display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap">
<div><div style="font:var(--type-price);color:var(--text-price)">3 200<span style="font:var(--type-caption);color:var(--text-muted);margin-left:4px">MAD/mois</span></div>
<div class="hex">--type-price · espace fine comme séparateur</div></div>
<div><div style="font:var(--weight-bold) 28px/1.2 var(--font-ui);color:var(--text-heading)">4,8<span style="font:var(--type-caption);color:var(--text-muted);margin-left:4px">· 126 avis</span></div>
<div class="hex">virgule décimale, jamais de point</div></div>
<div><div style="font:var(--weight-medium) 15px/1.4 var(--font-mono);color:var(--text-body)">DARI-RB-4821</div>
<div class="hex">--font-mono · réf. annonce</div></div></div></body></html>
