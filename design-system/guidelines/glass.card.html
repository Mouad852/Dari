<!-- @dsCard group="Brand" viewport="700x150" name="Glass & scrims" subtitle="Translucent white 72% + 12px blur — only over photography" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div style="height:110px;border-radius:var(--radius-card);background:linear-gradient(120deg,var(--clay-400),var(--sand-300));position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:0 16px">
<div style="background:var(--surface-glass);backdrop-filter:var(--blur-glass);border-radius:var(--radius-pill);padding:8px 14px;font:var(--type-label);color:var(--sable-900)">surface-glass</div>
<div style="width:44px;height:44px;border-radius:50%;background:var(--surface-glass);backdrop-filter:var(--blur-glass);box-shadow:var(--shadow-sm)"></div>
<div style="margin-left:auto;background:var(--surface-scrim);color:#fff;border-radius:var(--radius-sm);padding:8px 12px;font:var(--type-caption)">surface-scrim 56%</div></div></body></html>
