<!-- @dsCard group="Brand" viewport="700x180" name="Imagery & scrims" subtitle="Warm daylight photography, 14px radius, bottom scrim for text" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div style="display:flex;gap:12px">
<div style="flex:1;height:140px;border-radius:var(--radius-image);background:linear-gradient(135deg,var(--sand-200),var(--clay-300));position:relative;overflow:hidden">
<div style="position:absolute;inset:0;background:var(--scrim-image)"></div>
<div style="position:absolute;bottom:12px;left:14px;color:#fff"><div style="font:var(--weight-bold) 17px/1.2 var(--font-display)">Agdal, Rabat</div><div style="font:var(--type-caption);opacity:.85">scrim-image → texte lisible</div></div></div>
<div style="flex:0 0 200px;height:140px;border-radius:var(--radius-image);background:var(--sable-200);display:flex;align-items:center;justify-content:center;font:var(--type-caption);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--sable-500)">Photo</div>
<div style="flex:1;display:grid;gap:8px;align-content:center">
<div class="hex">Photos réelles, lumière chaude de fin de journée.</div>
<div class="hex">Aucun filtre bleu, aucun noir et blanc, aucun grain.</div>
<div class="hex">Placeholder = sable-200 + libellé PHOTO.</div></div></div></body></html>
