<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces in use" subtitle="Cream page, white card, inset field, charcoal inverse" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div style="display:flex;gap:12px;align-items:stretch">
<div style="flex:1;background:var(--bg-page);border:1px dashed var(--border-default);border-radius:var(--radius-card);padding:14px">
<div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card-inner);box-shadow:var(--shadow-sm);padding:12px">
<div style="font:var(--type-label);color:var(--text-heading)">surface-card sur bg-page</div>
<div style="margin-top:8px;height:28px;border-radius:var(--radius-control);background:var(--bg-inset);box-shadow:var(--inset-hairline)"></div></div></div>
<div style="flex:0 0 190px;background:var(--surface-inverse);color:var(--text-on-inverse);border-radius:var(--radius-card);padding:14px;display:flex;flex-direction:column;justify-content:space-between">
<span style="font:var(--type-label)">surface-inverse</span>
<span style="font:var(--type-caption);opacity:.7">toasts · tags sélectionnés</span></div>
<div style="flex:0 0 120px;border-radius:var(--radius-card);background:var(--clay-500);position:relative;overflow:hidden">
<div style="position:absolute;inset:0;background:var(--scrim-image)"></div>
<span style="position:absolute;bottom:10px;left:12px;color:#fff;font:var(--type-caption)">scrim-image</span></div></div></body></html>
