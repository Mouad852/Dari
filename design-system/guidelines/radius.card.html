<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<body><div style="display:flex;gap:14px;align-items:flex-end"><div style="text-align:center"><div style="width:72px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:6px"></div><div class="lbl">xs</div><div class="hex">6px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:10px"></div><div class="lbl">sm</div><div class="hex">10px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px"></div><div class="lbl">control</div><div class="hex">12px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px"></div><div class="lbl">image</div><div class="hex">14px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:18px"></div><div class="lbl">card</div><div class="hex">18px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:24px"></div><div class="lbl">xl</div><div class="hex">24px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:32px"></div><div class="lbl">2xl</div><div class="hex">32px</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:999px"></div><div class="lbl">pill</div><div class="hex">999px</div></div></div></body></html>
