<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div style="display:flex;gap:10px;align-items:flex-end"><div style="text-align:center"><div style="width:4px;height:4px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">1</div><div class="hex">4px</div></div><div style="text-align:center"><div style="width:6px;height:6px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">2</div><div class="hex">6px</div></div><div style="text-align:center"><div style="width:8px;height:8px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">3</div><div class="hex">8px</div></div><div style="text-align:center"><div style="width:12px;height:12px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">4</div><div class="hex">12px</div></div><div style="text-align:center"><div style="width:16px;height:16px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">5</div><div class="hex">16px</div></div><div style="text-align:center"><div style="width:20px;height:20px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">6</div><div class="hex">20px</div></div><div style="text-align:center"><div style="width:24px;height:24px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">7</div><div class="hex">24px</div></div><div style="text-align:center"><div style="width:32px;height:32px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">8</div><div class="hex">32px</div></div><div style="text-align:center"><div style="width:40px;height:40px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">9</div><div class="hex">40px</div></div><div style="text-align:center"><div style="width:56px;height:56px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">10</div><div class="hex">56px</div></div><div style="text-align:center"><div style="width:72px;height:72px;min-width:4px;background:var(--clay-300);border-radius:var(--radius-xs)"></div><div class="hex" style="margin-top:6px">11</div><div class="hex">72px</div></div></div></body></html>
