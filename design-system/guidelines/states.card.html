<!-- @dsCard group="Brand" viewport="700x160" name="Interaction states" subtitle="Hover darkens, press shrinks, focus rings terracotta" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg-page);font:var(--type-body);color:var(--text-body)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw div{flex:1;min-width:70px}
.chip{height:56px;border-radius:var(--radius-sm);box-shadow:var(--inset-hairline)}
.lbl{margin-top:6px;font:var(--type-caption);color:var(--text-heading)}
.hex{font:var(--weight-regular) var(--text-micro)/1.3 var(--font-mono);color:var(--text-muted)}</style></head>
<body><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
<div style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:var(--radius-pill);background:var(--brand);box-shadow:none;transform:none;color:#fff;font:var(--weight-semibold) 15px/1 var(--font-ui)">Repos</div><div style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:var(--radius-pill);background:var(--brand-hover);box-shadow:var(--shadow-brand);transform:none;color:#fff;font:var(--weight-semibold) 15px/1 var(--font-ui)">Survol</div><div style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:var(--radius-pill);background:var(--brand-press);box-shadow:none;transform:scale(.975);color:#fff;font:var(--weight-semibold) 15px/1 var(--font-ui)">Pressé</div><div style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:var(--radius-pill);background:var(--brand);box-shadow:var(--focus-ring);transform:none;color:#fff;font:var(--weight-semibold) 15px/1 var(--font-ui)">Focus</div><div style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:var(--radius-pill);background:var(--sable-200);box-shadow:none;transform:none;color:var(--text-subtle);font:var(--weight-semibold) 15px/1 var(--font-ui)">Désactivé</div>
</div><div class="hex" style="margin-top:12px">Surfaces : survol = ombre md + montée 2px. Lignes de liste : fond sable-50. Jamais d'opacité comme état de survol.</div></body></html>
