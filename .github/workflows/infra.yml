name: Infrastructure quality

on:
  push:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        stack: [bootstrap, production]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.59.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: tflint --init
      - run: tflint --format compact
      - run: pipx run --spec checkov==3.2.469 checkov -d . --framework terraform --quiet
      - if: matrix.stack == 'production'
        run: terraform test -test-directory=tests
