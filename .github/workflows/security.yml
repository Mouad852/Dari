name: Security scanning

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [apps/web, apps/mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Audit high and critical advisories
        run: npm audit --audit-level=high --omit=optional

  java-dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require NVD API key
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo 'NVD_API_KEY repository secret is required for OWASP Dependency-Check.' >&2
            exit 1
          fi
      - name: Run OWASP Dependency-Check
        working-directory: apps/api
        run: >-
          ./mvnw -B -ntp org.owasp:dependency-check-maven:13.0.0:check
          -Dformat=HTML,JSON
          -DoutputDirectory=target/dependency-check
          -DfailBuildOnCVSS=7
          -DnvdApiKey="$NVD_API_KEY"
          -DskipTestScope=true
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-dependency-check-report
          path: apps/api/target/dependency-check/
          if-no-files-found: warn

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, java-kotlin]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
