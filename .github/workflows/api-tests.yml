name: API and database quality

on:
  push:
    paths:
      - 'apps/api/**'
      - 'infra/db/**'
      - 'docker-compose.yml'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'infra/scripts/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'infra/db/**'
      - 'docker-compose.yml'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'infra/scripts/**'
      - '.github/workflows/api-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker is available
        run: docker version

      - name: Compile the API
        working-directory: apps/api
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Run the full PostGIS-backed test suite
        working-directory: apps/api
        run: ./mvnw -B -ntp test

      - name: Upload API reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            apps/api/target/surefire-reports/
            apps/api/target/failsafe-reports/
          if-no-files-found: warn

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker is available
        run: docker version

      - name: Apply every migration to an empty PostGIS database
        working-directory: apps/api
        run: ./mvnw -B -ntp -Dtest=FlywayMigrationSmokeTest test

      - name: Upload migration smoke reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-smoke-reports
          path: apps/api/target/surefire-reports/
          if-no-files-found: warn
